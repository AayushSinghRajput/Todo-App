<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %} {% endblock title %} Todo : Flask App Demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      :root {
        --primary-color: #4a6cf7;
        --secondary-color: #6c757d;
        --accent-color: #10b981;
        --dark-color: #1e293b;
        --light-color: #f8fafc;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f5f7fb;
        margin: 0;
        padding: 0;
      }

      .navbar-custom {
        background-color: white;
        box-shadow: var(--shadow);
        padding: 0.8rem 0;
        transition: all 0.3s ease;
      }

      .navbar-brand {
        font-weight: 700;
        font-size: 1.8rem;
        color: var(--primary-color) !important;
        display: flex;
        align-items: center;
      }

      .navbar-brand i {
        margin-right: 8px;
        font-size: 1.6rem;
      }

      .nav-link {
        font-weight: 500;
        color: var(--dark-color) !important;
        margin: 0 8px;
        border-radius: 6px;
        transition: all 0.2s ease;
        position: relative;
      }

      .nav-link:hover,
      .nav-link.active {
        color: var(--primary-color) !important;
        background-color: rgba(74, 108, 247, 0.1);
      }

      .nav-link.active::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 15%;
        width: 70%;
        height: 3px;
        background-color: var(--primary-color);
        border-radius: 2px;
      }

      .navbar-toggler {
        border: none;
        padding: 4px 8px;
      }

      .navbar-toggler:focus {
        box-shadow: none;
      }

      .search-form {
        position: relative;
        min-width: 280px; /* Ensure minimum width for search */
      }

      .search-input {
        border-radius: 50px;
        padding: 10px 20px;
        padding-right: 45px;
        border: 1px solid #e2e8f0;
        transition: all 0.3s ease;
        width: 100%; /* Changed to 100% to fill parent */
      }

      .search-input:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.2);
      }

      .search-btn {
        position: absolute;
        right: 5px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--primary-color);
        border: none;
        border-radius: 50%;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        transition: all 0.3s ease;
      }

      .search-btn:hover {
        background: #3a5bd9;
        transform: translateY(-50%) scale(1.05);
      }

      @media (max-width: 991px) {
        .search-form {
          margin-top: 15px;
          margin-bottom: 15px;
          min-width: auto; /* Remove min-width on mobile */
        }

        .search-input {
          width: 100%;
        }

        .nav-link.active::after {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navbar  -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-tasks"></i> MyTodo
        </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/">
                <i class="fas fa-home me-1"></i> Home
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about">
                <i class="fas fa-user me-1"></i> About
              </a>
            </li>
          </ul>

          <div class="d-flex align-items-center">
            <form class="search-form me-3">
              <input
                class="form-control search-input"
                type="search"
                placeholder="Search tasks..."
                aria-label="Search"
              />
              <button class="search-btn" type="submit">
                <i class="fas fa-search"></i>
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>
    {% block body %} {% endblock body %}
  </body>
</html>
